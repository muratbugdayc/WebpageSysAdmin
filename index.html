<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>z/OS COMPETENCY FRAMEWORK // PIP-BOY 3000</title>
  <meta name="description" content="Competency Framework for z/OS System Administrators — Level 1 and Level 2" />
  <!-- Google Fonts: VT323 for display, Share Tech Mono for body terminal text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💾</text></svg>" />
</head>
<body>
  <!-- CRT scanline + vignette overlay (purely decorative) -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- ══════════════════════════════════════════════════════════
       HEADER — always visible, sticky
  ═══════════════════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-inner">

      <!-- Branding -->
      <a href="#" class="header-brand" style="text-decoration:none;color:inherit;">
        <span class="header-icon" aria-hidden="true">[ ■ ]</span>
        <div>
          <p class="header-title">Z/OS COMPETENCY FRAMEWORK</p>
          <p class="header-subtitle">&gt;&gt; SYS ADMIN CERTIFICATION // LVL 1 &amp; LVL 2</p>
        </div>
      </a>

      <!-- Level filter toggle -->
      <nav class="level-toggle" aria-label="Filter by level">
        <button class="level-btn active" data-level="all"  aria-pressed="true">All</button>
        <button class="level-btn"        data-level="1"    aria-pressed="false">Level 1</button>
        <button class="level-btn"        data-level="2"    aria-pressed="false">Level 2</button>
      </nav>

    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════
       MAIN — dynamic content injected by app.js
  ═══════════════════════════════════════════════════════════ -->
  <main id="app" role="main" aria-live="polite">
    <!-- Content is rendered by JavaScript -->
    <div class="empty-state">
      <div class="empty-icon">⏳</div>
      <p>Loading…</p>
    </div>
  </main>

  <!-- ══════════════════════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════════════════════ -->
  <footer class="site-footer">
    [ Z/OS SYSADMIN COMPETENCY FRAMEWORK ] &mdash; BACHELOR&apos;S THESIS PROOF OF CONCEPT. Murat Bugdayci
    <span class="footer-blink">█</span>
  </footer>

  <!-- Scripts: data first, then app logic -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
